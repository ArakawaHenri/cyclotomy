name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require tag to match package version
        run: |
          node -e "const version = require('./package.json').version; const tag = process.env.GITHUB_REF_NAME; if (tag !== 'v' + version) throw new Error('tag ' + tag + ' does not match package version ' + version)"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Publish package
        run: npm publish --access public --provenance
