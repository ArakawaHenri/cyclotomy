name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    # Exercise the unbounded Pi peer range even when Cyclotomy itself is idle.
    - cron: "23 5 * * 1"
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    name: Node 24.15 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native locks
        run: npm run build:native

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Verify installed package loads through Pi
        run: npm run test:package

  lock-protocol:
    if: github.event_name != 'schedule'
    name: Lock handover 0.2.4 ↔ current · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native locks
        run: npm run build:native

      # The matrix fetches the published 0.2.4 artifact and drives real
      # cross-process contention against it, so the handover contract is
      # accepted on all three platforms rather than on the maintainer's host.
      - name: Run the lock transition matrix
        run: npm run test:lock-protocol

  native-locks:
    if: github.event_name != 'schedule'
    name: Native locks · ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux, arch: x64 }
          - { os: ubuntu-22.04-arm, platform: linux, arch: arm64 }
          - { os: macos-15-intel, platform: darwin, arch: x64 }
          - { os: macos-latest, platform: darwin, arch: arm64 }
          - { os: windows-latest, platform: win32, arch: x64 }
          - { os: windows-11-arm, platform: win32, arch: arm64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build native locks
        if: matrix.platform != 'linux'
        run: npm run build:native
      - name: Build Linux locks with the Node glibc baseline
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -v "$node_root:/node:ro" -w /work \
            quay.io/pypa/manylinux_2_28_${{ matrix.arch == 'x64' && 'x86_64' || 'aarch64' }} \
            /node/bin/node scripts/build-native.mjs --nodedir=/node --python=/opt/python/cp312-cp312/bin/python
      - name: Verify Node, Deno and published locks interoperate
        run: npm run test:lock-runtimes
      - name: Preserve verified native binary
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: prebuilds/
          if-no-files-found: error

  zstd-host-regression:
    if: github.event_name != 'schedule'
    name: Node 26.7 · Deno 2.9.5 · zstd regression
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.7.0

      - name: Verify Node zstd regression
        run: node scripts/verify-zstd-host.mjs

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Verify Deno zstd regression
        run: deno run scripts/verify-zstd-host.mjs

  minimum-pi:
    if: github.event_name != 'schedule'
    name: Minimum Pi and TUI 0.84.0 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Replace the host with the minimum supported Pi and TUI
        run: npm install --no-save --package-lock=false --ignore-scripts @earendil-works/pi-coding-agent@0.84.0 @earendil-works/pi-tui@0.84.0

      - name: Verify the minimum host versions
        run: |
          test "$(node -p "require('./node_modules/@earendil-works/pi-coding-agent/package.json').version")" = "0.84.0"
          test "$(node -p "require('./node_modules/@earendil-works/pi-tui/package.json').version")" = "0.84.0"

      - name: Build native locks
        run: npm run build:native

      - name: Type-check against the minimum host
        run: npm run check

      - name: Run real-Pi integration against the minimum host
        run: npm run test:real-pi

      - name: Verify the package loads through the minimum host
        run: npm run test:package

  latest-pi:
    # Advisory probe, not a gate. The locked host is already covered by `test`;
    # this job answers whether the newest published Pi still integrates, so an
    # upstream release surfaces here instead of in a user's install.
    name: Latest Pi compatibility probe
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pull requests get an advisory compatibility signal. The scheduled
    # canary is intentionally hard-failing so an upstream break is visible.
    continue-on-error: ${{ github.event_name != 'schedule' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve the latest published Pi
        id: latest
        shell: bash
        run: echo "version=$(npm view @earendil-works/pi-coding-agent@latest version)" >> "$GITHUB_OUTPUT"

      - name: Install the resolved latest Pi
        run: npm install --no-save --package-lock=false --ignore-scripts @earendil-works/pi-coding-agent@${{ steps.latest.outputs.version }}

      - name: Verify the resolved host version
        shell: bash
        run: test "$(node -p "require('./node_modules/@earendil-works/pi-coding-agent/package.json').version")" = "${{ steps.latest.outputs.version }}"

      - name: Build native locks
        run: npm run build:native

      - name: Type-check against the latest host
        run: npm run check

      - name: Probe real-Pi integration
        run: npm run test:real-pi

      - name: Verify the package loads through the latest host
        run: npm run test:package
