name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node 24.15 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Verify installed package loads through Pi
        run: npm run test:package

  latest-pi:
    # Advisory probe, not a gate. The locked host is already covered by `test`;
    # this job answers whether the newest published Pi still integrates, so an
    # upstream release surfaces here instead of in a user's install.
    name: Latest Pi compatibility probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install the latest published Pi
        run: npm install --no-save --ignore-scripts @earendil-works/pi-coding-agent@latest

      - name: Report the resolved host version
        run: npm ls @earendil-works/pi-coding-agent || true

      - name: Type-check against the latest host
        run: npm run check

      - name: Probe real-Pi integration
        run: npm run test:real-pi
